name: Preview mobile (Gradle)

# Builds the preview AAB with Gradle directly on a GitHub-hosted runner — no
# EAS build quota, and no self-hosted runner needed — and submits it to the
# Play Store internal testing track.
# This is the default preview path for pushes to develop; the EAS-based
# preview-mobile.yml remains available via manual dispatch as a fallback.
#
# Prerequisites (GitHub secrets):
#   ANDROID_KEYSTORE_BASE64   — Play upload keystore exported from EAS
#                               (eas credentials -p android), base64-encoded
#   ANDROID_KEYSTORE_PASSWORD — keystore password from the same export
#   ANDROID_KEY_ALIAS         — key alias from the same export
#   ANDROID_KEY_PASSWORD      — key password from the same export
#   GOOGLE_PLAY_KEY_BASE64    — Google Play service account JSON key (already
#                               used by the EAS workflows); submit is skipped
#                               when absent, the AAB is still built + uploaded
#                               as a workflow artifact
#
# versionCode = 100 + run number: strictly increasing, and offset well above
# anything the old EAS remote version counter produced.

on:
  push:
    branches: [develop]
    paths:
      - 'frontend/**'
      - 'shared/**'
      - '.github/workflows/selfhosted-preview-mobile.yml'
  workflow_dispatch:

concurrency:
  group: selfhosted-preview-mobile
  cancel-in-progress: true

jobs:
  android:
    name: Gradle preview build & Play submit (Android)
    runs-on: ubuntu-latest
    steps:
      - name: Verify signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          missing=""
          [ -z "$KEYSTORE_B64" ] && missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -z "$KEYSTORE_PASSWORD" ] && missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ] && missing="$missing ANDROID_KEY_ALIAS"
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub secrets:$missing — export the upload keystore from EAS (eas credentials -p android) and add them. See the header of this workflow file."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Decode upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/upload.keystore"

      - name: Compute versionCode
        run: echo "ANDROID_VERSION_CODE=$(( 100 + ${{ github.run_number }} ))" >> "$GITHUB_ENV"

      - name: Generate android project (expo prebuild)
        working-directory: frontend
        env:
          # Same values as the eas.json preview profile — EXPO_PUBLIC_* vars are
          # inlined into the JS bundle at build time.
          EXPO_PUBLIC_API_URL: https://reprounds-api-prod.oemerdigital.workers.dev
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 548195273503-mkd114c10dkhhv90621j2o019pdkgvkm.apps.googleusercontent.com
          EXPO_PUBLIC_REVENUECAT_ANDROID_KEY: goog_ZpncuQvvJAPGFSlhgiTBbPGGVea
        run: npx expo prebuild --platform android --no-install

      - name: Apply upload-key signing config
        working-directory: frontend
        run: node scripts/apply-android-signing.js

      - name: Build release AAB
        working-directory: frontend/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # EXPO_PUBLIC_* must match prebuild: the JS bundle is produced here.
          EXPO_PUBLIC_API_URL: https://reprounds-api-prod.oemerdigital.workers.dev
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 548195273503-mkd114c10dkhhv90621j2o019pdkgvkm.apps.googleusercontent.com
          EXPO_PUBLIC_REVENUECAT_ANDROID_KEY: goog_ZpncuQvvJAPGFSlhgiTBbPGGVea
        run: ./gradlew :app:bundleRelease --no-daemon

      # Keep the AAB around even if Play submission is skipped or fails.
      - name: Upload AAB as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: reprounds-preview-aab
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Decode Google Play service account key
        id: playkey
        env:
          GOOGLE_PLAY_KEY: ${{ secrets.GOOGLE_PLAY_KEY_BASE64 }}
        run: |
          if [ -z "$GOOGLE_PLAY_KEY" ]; then
            echo "::warning::GOOGLE_PLAY_KEY_BASE64 not set — skipping Play Store submit (AAB is attached as a workflow artifact)."
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The secret may be raw JSON or base64 (possibly line-wrapped from the encoder).
          trimmed=$(printf '%s' "$GOOGLE_PLAY_KEY" | tr -d '[:space:]')
          case "$trimmed" in
            {*) printf '%s' "$GOOGLE_PLAY_KEY" > frontend/google-play-key.json ;;
            *)
              if ! printf '%s' "$trimmed" | base64 -d > frontend/google-play-key.json 2>/dev/null; then
                echo "::error::GOOGLE_PLAY_KEY_BASE64 is neither raw JSON nor valid base64"
                exit 1
              fi
              ;;
          esac
          if ! node -e "JSON.parse(require('fs').readFileSync('frontend/google-play-key.json', 'utf8'))" 2>/dev/null; then
            echo "::error::GOOGLE_PLAY_KEY_BASE64 decoded, but the result is not valid JSON"
            rm -f frontend/google-play-key.json
            exit 1
          fi
          echo "has_key=true" >> "$GITHUB_OUTPUT"

      - name: Submit to Play internal testing track
        if: steps.playkey.outputs.has_key == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: frontend/google-play-key.json
          packageName: com.reprounds.app
          releaseFiles: frontend/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

      - name: Clean up decoded key
        if: always()
        run: rm -f frontend/google-play-key.json

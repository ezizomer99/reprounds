name: Release mobile

# Builds the production Android AAB on EAS and submits it to Google Play.
# Triggered deliberately by pushing a version tag (e.g. `git tag v1.0.0 && git push --tags`)
# so app releases are intentional rather than on every merge.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  android:
    name: EAS build & submit (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: pnpm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Decode Google Play service account key
        env:
          GOOGLE_PLAY_KEY: ${{ secrets.GOOGLE_PLAY_KEY_BASE64 }}
        run: |
          # The secret may be raw JSON or base64 (possibly line-wrapped from the encoder).
          trimmed=$(printf '%s' "$GOOGLE_PLAY_KEY" | tr -d '[:space:]')
          case "$trimmed" in
            {*) printf '%s' "$GOOGLE_PLAY_KEY" > frontend/google-play-key.json ;;
            *)
              if ! printf '%s' "$trimmed" | base64 -d > frontend/google-play-key.json 2>/dev/null; then
                echo "::error::GOOGLE_PLAY_KEY_BASE64 is neither raw JSON nor valid base64"
                exit 1
              fi
              ;;
          esac
          if ! node -e "JSON.parse(require('fs').readFileSync('frontend/google-play-key.json', 'utf8'))" 2>/dev/null; then
            echo "::error::GOOGLE_PLAY_KEY_BASE64 decoded, but the result is not valid JSON"
            rm -f frontend/google-play-key.json
            exit 1
          fi

      - name: Build production AAB on EAS
        working-directory: frontend
        run: eas build --profile production --platform android --non-interactive --wait

      - name: Submit latest build to Google Play (Closed testing / alpha track)
        working-directory: frontend
        run: eas submit --profile alpha --platform android --latest --non-interactive

      - name: Remove service account key
        if: always()
        run: rm -f frontend/google-play-key.json

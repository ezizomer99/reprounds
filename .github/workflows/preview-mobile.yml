name: Preview mobile

# Builds a preview APK on EAS and submits it to the Play Store internal testing
# track whenever frontend or shared code is pushed to develop.
# Use this to verify a feature end-to-end on a real device before merging to main.
#
# Prerequisites (GitHub secrets):
#   EXPO_TOKEN            — personal access token from expo.dev/settings/access-tokens
#   GOOGLE_PLAY_KEY_BASE64 — Google Play service account JSON key, base64-encoded
#                            (raw JSON is also accepted)
#
# The build is only triggered when frontend or shared code changes; backend-only
# changes on develop do not waste an EAS build quota slot.

on:
  push:
    branches: [develop]
    paths:
      - 'frontend/**'
      - 'shared/**'
      - '.github/workflows/preview-mobile.yml'
  workflow_dispatch:

concurrency:
  group: preview-mobile
  cancel-in-progress: true

jobs:
  android:
    name: EAS preview build & submit (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: pnpm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build preview APK on EAS
        working-directory: frontend
        run: eas build --profile preview --platform android --non-interactive --wait

      - name: Submit to Play Store internal track
        working-directory: frontend
        env:
          GOOGLE_PLAY_KEY: ${{ secrets.GOOGLE_PLAY_KEY_BASE64 }}
        run: |
          if [ -z "$GOOGLE_PLAY_KEY" ]; then
            echo "GOOGLE_PLAY_KEY_BASE64 secret not set — skipping Play Store submission"
            exit 0
          fi
          # The secret may be raw JSON or base64 (possibly line-wrapped from the encoder).
          trimmed=$(printf '%s' "$GOOGLE_PLAY_KEY" | tr -d '[:space:]')
          case "$trimmed" in
            {*) printf '%s' "$GOOGLE_PLAY_KEY" > google-play-key.json ;;
            *)
              if ! printf '%s' "$trimmed" | base64 -d > google-play-key.json 2>/dev/null; then
                echo "::error::GOOGLE_PLAY_KEY_BASE64 is neither raw JSON nor valid base64"
                exit 1
              fi
              ;;
          esac
          if ! node -e "JSON.parse(require('fs').readFileSync('google-play-key.json', 'utf8'))" 2>/dev/null; then
            echo "::error::GOOGLE_PLAY_KEY_BASE64 decoded, but the result is not valid JSON"
            rm -f google-play-key.json
            exit 1
          fi
          eas submit --profile preview --platform android --latest --non-interactive
          rm -f google-play-key.json

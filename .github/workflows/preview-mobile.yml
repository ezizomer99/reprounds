name: Preview mobile

# Builds a preview AAB on EAS and submits it to the Play Store internal testing
# track. (Play rejects APKs on every track for apps enrolled in Play App
# Signing — must be an AAB.)
#
# Manual-dispatch only: pushes to develop are built by the self-hosted Gradle
# workflow (selfhosted-preview-mobile.yml) instead, which doesn't consume EAS
# build quota. Keep this as a fallback when the self-hosted path is broken.
#
# Prerequisites (GitHub secrets):
#   EXPO_TOKEN            — personal access token from expo.dev/settings/access-tokens
#   GOOGLE_PLAY_KEY_BASE64 — Google Play service account JSON key, base64-encoded
#                            (raw JSON is also accepted)

on:
  workflow_dispatch:

concurrency:
  group: preview-mobile
  cancel-in-progress: true

jobs:
  android:
    name: EAS preview build & submit (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: pnpm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build preview AAB on EAS
        id: eas_build
        working-directory: frontend
        # Capture the build id so the submit step targets exactly this build —
        # `eas submit --latest` can pick an older, already-submitted build.
        run: |
          BUILD_JSON=$(eas build --profile preview --platform android --non-interactive --wait --json)
          echo "$BUILD_JSON" | jq -r '.[0].id' | xargs -I{} echo "build_id={}" >> "$GITHUB_OUTPUT"

      - name: Submit to Play Store internal track
        working-directory: frontend
        env:
          GOOGLE_PLAY_KEY: ${{ secrets.GOOGLE_PLAY_KEY_BASE64 }}
        run: |
          if [ -z "$GOOGLE_PLAY_KEY" ]; then
            echo "GOOGLE_PLAY_KEY_BASE64 secret not set — skipping Play Store submission"
            exit 0
          fi
          # The secret may be raw JSON or base64 (possibly line-wrapped from the encoder).
          trimmed=$(printf '%s' "$GOOGLE_PLAY_KEY" | tr -d '[:space:]')
          case "$trimmed" in
            {*) printf '%s' "$GOOGLE_PLAY_KEY" > google-play-key.json ;;
            *)
              if ! printf '%s' "$trimmed" | base64 -d > google-play-key.json 2>/dev/null; then
                echo "::error::GOOGLE_PLAY_KEY_BASE64 is neither raw JSON nor valid base64"
                exit 1
              fi
              ;;
          esac
          if ! node -e "JSON.parse(require('fs').readFileSync('google-play-key.json', 'utf8'))" 2>/dev/null; then
            echo "::error::GOOGLE_PLAY_KEY_BASE64 decoded, but the result is not valid JSON"
            rm -f google-play-key.json
            exit 1
          fi
          eas submit --profile preview --platform android --id "${{ steps.eas_build.outputs.build_id }}" --non-interactive
          rm -f google-play-key.json

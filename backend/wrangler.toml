name = "glima-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Secrets (set via `wrangler secret put`):
#   JWT_SECRET
#   GOOGLE_CLIENT_ID

[vars]
# Replace with the actual pub-<hash>.r2.dev URL after enabling public access on the bucket
R2_PUBLIC_BASE_URL = "https://pub-REPLACE_ME.r2.dev"

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "db7f181b10b5414c9b28ef51aa37cee3"

[[r2_buckets]]
binding = "EXERCISES_BUCKET"
bucket_name = "ma-fitness-exercises"
